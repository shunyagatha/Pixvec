name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The native dependencies ship per-platform prebuilds, so all three
        # matter: a binary that resolves on Linux can be absent on Windows.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke-test the CLI
        shell: bash
        run: |
          node dist/esm/cli.js --version
          node dist/esm/cli.js --help > /dev/null
          node scripts/smoke.mjs

      # The extensions embed the engine at packaging time, so a version drift
      # here means their users keep an older tracer than the one released — the
      # way the Figma plugin once bundled a published engine while this repo's
      # fixes sat unused. Fail the build rather than let that ship again.
      - name: Extensions track the released engine
        run: node scripts/sync-extension-versions.mjs --check

  # The playground ships a *committed* bundle of the engine, so unlike every
  # other surface it does not pick up a change by being rebuilt — someone has to
  # remember. Nobody did: it sat sixteen minor versions behind at v1.32.0 while
  # the package was at 1.48.0, so the public demo of "measured, never asserted"
  # was measuring a tracer nobody had shipped in months, and was missing the
  # whole v1.47.0 security pass. Nothing failed, because nothing looked.
  #
  # Rebuilding and diffing is the only honest check: it compares the file in the
  # tree against what the current source actually produces, rather than trusting
  # a version string the bundle has no obligation to update. One platform is
  # enough — esbuild's output is deterministic and .gitattributes pins eol=lf, so
  # a second OS would re-prove the same bytes.
  playground:
    name: Playground bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild and compare
        run: |
          npm run playground
          git diff --exit-code -- docs/vecline-core.js || {
            echo "::error::docs/vecline-core.js is stale. Run 'npm run playground' and commit the result."
            exit 1
          }

  # The accuracy table is the project's central claim, and it has been wrong
  # twice — both corrections are recorded in the README itself, and the v1.38.1
  # note says plainly that the earlier claim was false. Both were caught because
  # a person decided to re-run the harness; nothing forced it.
  #
  # This compares the published rows against a fresh measurement rather than
  # against a committed snapshot. A snapshot would let the README and the
  # numbers drift together while the check stayed green.
  readme-numbers:
    name: README numbers still reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the engine
        run: npm run build

      - name: Re-measure and compare
        run: npm run check:readme

      # The scale-fidelity frontier: rendered at 4x against vector ground truth
      # the tracer never sees, scored on the edge band, and reported as accuracy
      # per anchor spent. This is the number `check:readme` above cannot see —
      # whole-frame SSIM at 1x saturates at 1.0000 for output that is a bitmap in
      # an SVG container, which is exactly what it reported.
      #
      # Deliberately NOT a pass/fail gate yet. Today's default emits zero curve
      # commands and spends thousands of anchors, so a gate here would encode
      # that as the baseline to protect. It runs so the table is visible on every
      # PR while the foundation work lands; it becomes a gate once the numbers
      # are worth defending.
      - name: Scale-fidelity frontier (reported, not gated)
        run: npm run bench:scale

  # The plugin's dist/ is gitignored, so the sandbox tests skip in the matrix
  # above rather than failing every contributor who has not built an extension
  # they are not touching. This job is what stops that skip becoming a place for
  # bugs to hide: it builds the real bundle and runs the tests against it. One
  # platform is enough — the bundle is plain JS with no native parts.
  figma-plugin:
    name: Figma plugin bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # build.mjs aliases vecline/core to ../../dist, so the engine must exist
      # before the plugin can bundle it.
      - name: Build the engine
        run: npm run build

      - name: Build the plugin
        working-directory: extensions/figma
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Test the built bundle
        run: npx vitest run test/figma-sandbox.test.ts test/figma-placement.test.ts test/figma-exact-mode.test.ts
