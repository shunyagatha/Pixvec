name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The native dependencies ship per-platform prebuilds, so all three
        # matter: a binary that resolves on Linux can be absent on Windows.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke-test the CLI
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          node scripts/smoke.mjs
