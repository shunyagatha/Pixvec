name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The native dependencies ship per-platform prebuilds, so all three
        # matter: a binary that resolves on Linux can be absent on Windows.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke-test the CLI
        shell: bash
        run: |
          node dist/esm/cli.js --version
          node dist/esm/cli.js --help > /dev/null
          node scripts/smoke.mjs

      # The extensions embed the engine at packaging time, so a version drift
      # here means their users keep an older tracer than the one released — the
      # way the Figma plugin once bundled a published engine while this repo's
      # fixes sat unused. Fail the build rather than let that ship again.
      - name: Extensions track the released engine
        run: node scripts/sync-extension-versions.mjs --check
