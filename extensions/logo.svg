<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 384" fill-rule="evenodd">
<style>
/* The favicon carries its own theme logic, since a browser tab has no access to
   the page's CSS variables. Monogram flips with the OS colour scheme so it is
   legible on a light or dark tab strip; the arrow keeps the magenta accent. */
.mk{fill:#1B1220}
@media (prefers-color-scheme:dark){.mk{fill:#F3EDF4}}
</style>
<defs><linearGradient id="vgrad" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#A3005A"/><stop offset="1" stop-color="#FF4D9E"/>
</linearGradient></defs>
