      <rect x="1280" y="616" width="546" height="206" rx="14" fill="#1C1624" stroke="#302839"/>
      <rect x="1280" y="616" width="6" height="206" rx="3" fill="#FF4D9E"/>
      <text x="1316" y="692" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F3EDF4">In your build</text>
      <text x="1316" y="738" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">Vite plugin, GitHub Action, DXF and</text>
<text x="1316" y="774" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">G-code out.</text>
    </g>
  <text x="100" y="948" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" fill="#B9AEC2">One MIT codebase behind all six&#160;&#8212;&#160;so a result you get here is the result you get anywhere.</text>

<text x="100" y="1016" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" fill="#8E819A">Free and open source (MIT)&#160;&#183;&#160;vecline.xyz</text>
