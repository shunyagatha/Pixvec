<text x="168" y="118" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700"
      letter-spacing="1" fill="#F3EDF4">VECLINE</text>

<text x="100" y="232" font-family="'Arial Narrow', sans-serif" font-size="86" font-weight="700"
      letter-spacing="0.5" fill="#F3EDF4">The same engine, wherever you work.</text>
<text x="100" y="288" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" fill="#B9AEC2">This plugin is one surface on a toolkit, not a one-off.</text>

<g>
      <rect x="100" y="366" width="546" height="206" rx="14" fill="#1C1624" stroke="#302839"/>
      <rect x="100" y="366" width="6" height="206" rx="3" fill="#FF4D9E"/>
      <text x="136" y="442" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F3EDF4">In Figma</text>
      <text x="136" y="488" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">This plugin. Select, trace, keep the</text>
<text x="136" y="524" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">paths.</text>
    </g>
<g>
      <rect x="690" y="366" width="546" height="206" rx="14" fill="#1C1624" stroke="#302839"/>
