      <text x="726" y="442" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F3EDF4">In VS Code</text>
      <text x="726" y="488" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">Right-click a PNG, get a verified SVG.</text>
    </g>
<g>
      <rect x="1280" y="366" width="546" height="206" rx="14" fill="#1C1624" stroke="#302839"/>
