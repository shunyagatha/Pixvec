      <text x="1316" y="442" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F3EDF4">On the command line</text>
      <text x="1316" y="488" font-family="Consolas, monospace" font-size="22" fill="#4BD3A0">npx vecline vectorize logo.png --verify</text>
    </g>
<g>
      <rect x="100" y="616" width="546" height="206" rx="14" fill="#1C1624" stroke="#302839"/>
      <rect x="100" y="616" width="6" height="206" rx="3" fill="#FF4D9E"/>
      <text x="136" y="692" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F3EDF4">In the browser</text>
      <text x="136" y="738" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">vecline.xyz. No upload, no signup, no</text>
<text x="136" y="774" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">limit.</text>
    </g>
<g>
      <rect x="690" y="616" width="546" height="206" rx="14" fill="#1C1624" stroke="#302839"/>
      <rect x="690" y="616" width="6" height="206" rx="3" fill="#FF4D9E"/>
      <text x="726" y="692" font-family="'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F3EDF4">To an AI agent</text>
      <text x="726" y="738" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">An MCP server, so agents can trace and</text>
<text x="726" y="774" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" fill="#B9AEC2">measure.</text>
    </g>
