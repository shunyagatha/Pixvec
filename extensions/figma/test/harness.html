<!doctype html><meta charset="utf-8">
<title>Figma sandbox harness</title>
<body style="font:12px ui-monospace,monospace;padding:16px;background:#111;color:#ddd">
<h3 style="font:600 13px system-ui">Vecline plugin — sandbox-half harness</h3>
<pre id="log">running…</pre>
<script>
// A stand-in for Figma's plugin sandbox, faithful to the parts code.js touches.
// This exercises the half that has no DOM in production: selection export,
// message plumbing, node insertion, and placement.
const log = [];
const say = (s) => { log.push(s); document.getElementById('log').textContent = log.join('\n'); };

const inserted = [];
let uiHandler = null;
const fakeNode = (over) => Object.assign({
  type: 'RECTANGLE', name: 'Logo', x: 10, y: 20, width: 200, height: 200,
  exportAsync: async () => new Uint8Array([137,80,78,71]),   // PNG magic
}, over);

const selection = [fakeNode({})];

globalThis.__html__ = '<html></html>';
globalThis.figma = {
  showUI: (html, opts) => say('  showUI called  ' + JSON.stringify(opts)),
  ui: {
    postMessage: (m) => say('  → ui: ' + JSON.stringify(m).slice(0, 120)),
    set onmessage(fn) { uiHandler = fn; say('  ui.onmessage registered'); },
    get onmessage() { return uiHandler; },
  },
  currentPage: { get selection() { return selection; }, set selection(v) { say('  selection set to ' + v.length + ' node(s)'); } },
  viewport: { scrollAndZoomIntoView: () => say('  viewport scrolled to result') },
  notify: (msg, opts) => say('  NOTIFY' + (opts && opts.error ? ' (error)' : '') + ': ' + msg),
  createNodeFromSvg: (svg) => {
    if (!/^<svg/.test(svg.trim())) throw new Error('not an svg');
    inserted.push(svg);
    return fakeNode({ name: 'inserted', x: 0, y: 0, width: 200, height: 200 });
  },
  on: (evt) => say('  figma.on("' + evt + '") registered'),
};

(async () => {
  try {
    say('loading dist/code.js …');
    await import('../dist/code.js');
    say('  loaded ✓');

    // 1. The UI announces itself; the sandbox should answer with the selection.
    say('\n[1] ui says "ready" → expect a selection message with PNG bytes');
    await uiHandler({ type: 'ready' });

    // 2. The UI returns traced geometry; the sandbox should insert and notify.
    say('\n[2] ui says "traced" → expect createNodeFromSvg + placement + notify');
    await uiHandler({ type: 'traced', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><path d="M0 0h10v10H0z" fill="#123"/></svg>', ssim: 0.9825, psnr: 33.8, ms: 428, bytes: 4227 });

    // 3. A failure should surface as an error notice, not a crash.
    say('\n[3] ui says "failed" → expect an error notice');
    await uiHandler({ type: 'failed', message: 'decode failed' });

    // 4. Malformed SVG must be reported, not swallowed.
    say('\n[4] traced with junk SVG → expect a rejection notice');
    await uiHandler({ type: 'traced', svg: 'not svg at all', ssim: null, psnr: null, ms: 1, bytes: 3 });

    say('\nRESULT: nodes inserted = ' + inserted.length + ' (expect exactly 1)');
    say(inserted.length === 1 ? 'PASS' : 'FAIL');
  } catch (e) {
    say('THREW: ' + e.message);
  }
})();
</script>
