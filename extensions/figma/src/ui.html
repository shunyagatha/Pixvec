<meta charset="utf-8">
<!--
  Plugin panel.

  Figma supplies its own theme as CSS variables when `themeColors: true` is set in
  showUI, so the panel follows the editor's light/dark setting instead of guessing.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 14px;
    font: 12px/1.45 Inter, -apple-system, "Segoe UI", sans-serif;
    color: var(--figma-color-text, #1a1a1a);
    background: var(--figma-color-bg, #fff);
  }
  .brand{display:flex;align-items:center;gap:8px;margin:0 0 2px}
  .mark{width:20px;height:20px;flex:0 0 auto;display:block;color:var(--figma-color-text,#1a1a1a)}
  .mark svg{width:100%;height:100%;display:block}
  h1 { font-size: 12px; font-weight: 600; letter-spacing: .01em; margin:0; }
  .sub { color: var(--figma-color-text-secondary, #777); margin: 0 0 14px; }
  .target {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    padding: 8px 10px; border-radius: 6px;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    color: var(--figma-color-text, #1a1a1a);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 14px;
  }
  label { display: block; margin: 0 0 5px; font-weight: 500; }
  .row { margin-bottom: 13px; }
  /* A control the current mode ignores is dimmed rather than hidden, so the
     layout does not jump and it stays obvious the setting still exists. */
  .row.muted { opacity: .4; }
  .inline { display: flex; align-items: center; gap: 8px; }
  select, input[type=range] { width: 100%; }
  select {
    padding: 6px; border-radius: 5px; font: inherit;
    border: 1px solid var(--figma-color-border, #ddd);
    background: var(--figma-color-bg, #fff); color: inherit;
  }
  .val { font-family: ui-monospace, monospace; min-width: 22px; text-align: right; color: var(--figma-color-text-secondary, #777); }
  button {
    width: 100%; padding: 9px; border: 0; border-radius: 6px; cursor: pointer;
    font: inherit; font-weight: 600;
    background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff);
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #status {
    margin-top: 11px; text-align: center; min-height: 16px;
    font-family: ui-monospace, monospace; font-size: 11px;
    color: var(--figma-color-text-secondary, #777);
  }
  #status[data-kind="error"] { color: var(--figma-color-text-danger, #d1006f); }
  .note {
    margin-top: 14px; padding-top: 12px; font-size: 11px; line-height: 1.5;
    border-top: 1px solid var(--figma-color-border, #eee);
    color: var(--figma-color-text-secondary, #777);
  }
</style>

<div class="brand"><span class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 384" fill-rule="evenodd"><defs><linearGradient id="vgrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#A3005A"/><stop offset="1" stop-color="#FF4D9E"/></linearGradient></defs><path fill="currentColor" d="M7 96L130 96L179 173L153 197L110 130L70 131L128 221L102 246L7 98ZM353 96L187 377L139 303L164 277L187 310L264 180L353 97Z"/><path d="M395 6L399 8L380 87L358 69L48 368L23 344L336 45L318 25L395 7Z" fill="url(#vgrad)"/></svg></span><h1>Vecline</h1></div>
<p class="sub">Vectorize the selection, and measure how close it landed.</p>

<div class="target" id="target">—</div>

<div class="row">
  <label for="mode">Mode</label>
  <select id="mode">
    <option value="trace">Trace — filled colour contours</option>
    <option value="centerline">Centerline — single strokes</option>
  </select>
</div>

<div class="row">
  <label for="colors">Colours <span class="val" id="colorsVal">16</span></label>
  <input type="range" id="colors" min="2" max="64" value="16">
</div>

<div class="row inline">
  <input type="checkbox" id="gradients" checked>
  <label for="gradients" style="margin:0">Reconstruct gradients</label>
</div>

<!-- Off by default: adaptive thresholding compares each pixel with its own
     neighbourhood, which rescues a photograph with a shadow across it and
     wrecks flat artwork, where a pixel inside a large fill is its own
     neighbourhood. Most Figma layers are flat artwork. -->
<div class="row inline">
  <input type="checkbox" id="uneven">
  <label for="uneven" style="margin:0">Uneven lighting (photo of paper)</label>
</div>

<button id="go" disabled>Vectorize</button>
<div id="status">Select a layer</div>

<p class="note">
  The result is placed beside your layer, not over it. Nothing leaves this
  document — the tracer runs inside the plugin, and it makes no network requests.
</p>

<script src="ui.js"></script>
